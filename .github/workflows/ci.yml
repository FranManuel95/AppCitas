name: CI

# Calidad en cada push/PR: tests de dominio + build de producción, y la
# suite E2E de Playwright contra un servidor real con SQLite sembrado.
on:
  push:
  pull_request:

jobs:
  build-y-tests:
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: "file:./dev.db"
      AUTH_SECRET: "ci-secret-solo-para-build"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Instalar dependencias
        run: npm ci
      - name: Tests de dominio (vitest)
        run: npx vitest run
      - name: Preparar esquema de base de datos
        # El build prerenderiza /sitemap.xml, que consulta Prisma; sin el
        # esquema aplicado la tabla no existe y el build falla (P2021).
        run: npx prisma db push
      - name: Build de producción
        run: npm run build

  e2e:
    runs-on: ubuntu-latest
    env:
      AUTH_SECRET: "ci-secret-solo-para-e2e"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Instalar dependencias
        run: npm ci
        env:
          DATABASE_URL: "file:./e2e.db"
      - name: Instalar Chromium de Playwright
        run: npx playwright install --with-deps chromium
      - name: Suite E2E
        run: npm run test:e2e
      - name: Guardar informe si falla
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7

  # El grueso de los tests corre con SQLite (rápido y sin servicios), pero el
  # bloqueo anti doble-reserva depende de `pg_advisory_xact_lock`, que es un
  # no-op en SQLite: la única forma de ejercitarlo de verdad es contra Postgres.
  # Este job levanta un Postgres real, aplica el esquema PG, siembra y lanza N
  # reservas concurrentes al mismo hueco; espera exactamente 1 creada.
  concurrencia-postgres:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: appcitas_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: "postgresql://postgres:postgres@localhost:5432/appcitas_ci"
      AUTH_SECRET: "ci-secret-solo-para-postgres"
      # Varias conexiones para que las reservas concurrentes se ejecuten de
      # verdad en paralelo y sea el advisory lock —no el pool— quien las
      # serialice (con max=1 la cola del pool enmascararía la carrera).
      PG_POOL_MAX: "8"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Instalar dependencias
        run: npm ci
      # prisma.config.ts elige schema (schema.postgres.prisma) y url del
      # datasource automáticamente según DATABASE_URL: no se pasa --schema (ese
      # fichero no declara url; la aporta la config).
      - name: Generar cliente Prisma para PostgreSQL
        run: npx prisma generate
      - name: Aplicar esquema a PostgreSQL
        run: npx prisma db push --accept-data-loss
      - name: Sembrar datos de demo
        run: npm run db:seed
      - name: Verificar bloqueo anti doble-reserva (advisory locks reales)
        run: npx tsx scripts/verify-concurrent-booking.ts
