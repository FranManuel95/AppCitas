<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#5b3fd6" />
    <title>Sin conexión · AppCitas</title>
    <style>
      body {
        margin: 0;
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
        background: #fafafa;
        color: #1a1a1a;
        padding: 1.5rem;
        text-align: center;
      }
      .brand {
        font-size: 0.875rem;
        font-weight: 600;
        color: #5b3fd6;
        letter-spacing: 0.02em;
      }
      h1 {
        font-size: 1.25rem;
        margin: 0.75rem 0 0;
      }
      p {
        font-size: 0.9rem;
        line-height: 1.6;
        color: #555;
        margin: 0.75rem 0 1.5rem;
        max-width: 26rem;
      }
      button {
        background: #5b3fd6;
        color: #fff;
        border: 0;
        border-radius: 0.5rem;
        padding: 0.6rem 1.25rem;
        font-size: 0.9rem;
        font-weight: 500;
        cursor: pointer;
      }
    </style>
  </head>
  <body>
    <div>
      <p class="brand">AppCitas</p>
      <h1>Sin conexión · No connection</h1>
      <p>
        Parece que no tienes internet ahora mismo. Tus citas siguen ahí:
        reintenta cuando vuelvas a tener conexión.
        <br />
        It looks like you're offline. Your appointments are safe — try again
        once you're back online.
      </p>
      <button type="button" onclick="location.reload()">
        Reintentar · Retry
      </button>
    </div>
  </body>
</html>
